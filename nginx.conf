server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app support for hash router and client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|json|svg|png|jpg|jpeg|gif|ico|txt|woff2?|map)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:html)$ {
        access_log off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
